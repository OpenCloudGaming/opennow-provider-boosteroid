[package]
name = "boosteroid-media"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[dependencies]
boosteroid-common = { path = "../common" }
opennow-plugin-api = { git = "https://github.com/OpenCloudGaming/opennow", rev = "683eaa0ecfb60738388def065944c7284154be5c" }
opennow-media-protocol = { git = "https://github.com/OpenCloudGaming/opennow", rev = "683eaa0ecfb60738388def065944c7284154be5c" }
anyhow = "1"
async-trait = "0.1"
bytes = "1"
futures-util = { version = "0.3", features = ["sink"] }
h264-reader = "=0.9.0"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
rtc = "=0.21.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-std", "io-util", "net", "sync", "time"] }
tokio-tungstenite = { version = "0.28", default-features = false, features = ["connect", "rustls-tls-native-roots"] }
tokio-util = { version = "0.7", features = ["rt"] }
url = "2"
uuid = { version = "1", features = ["v4"] }
webrtc = "=0.21.0"

[dev-dependencies]
tempfile = "3"
