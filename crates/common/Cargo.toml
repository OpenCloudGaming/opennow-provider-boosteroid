[package]
name = "boosteroid-common"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.85"

[dependencies]
opennow-plugin-api = { git = "https://github.com/OpenCloudGaming/opennow", rev = "683eaa0ecfb60738388def065944c7284154be5c" }
opennow-media-protocol = { git = "https://github.com/OpenCloudGaming/opennow", rev = "683eaa0ecfb60738388def065944c7284154be5c" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
subtle = "2.6"
getrandom = "0.3"
fs2 = "0.4"
cap-std = "4.0.3"
cap-fs-ext = "4.0.3"
zeroize = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Threading", "Win32_System_Memory", "Win32_System_WindowsProgramming"] }

[dev-dependencies]
tempfile = "3"
