[package]
name = "boosteroid-control"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[dependencies]
boosteroid-common = { path = "../common" }
boosteroid-media = { path = "../media" }
opennow-plugin-api = { git = "https://github.com/OpenCloudGaming/opennow", rev = "683eaa0ecfb60738388def065944c7284154be5c" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std", "io-util", "sync", "time", "net"] }
tokio-util = { version = "0.7", features = ["rt"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
futures-util = "0.3"
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"
hex = "0.4"
keyring = { version = "3", features = ["sync-secret-service", "crypto-rust", "apple-native", "windows-native"] }
zeroize = "1"

[dev-dependencies]
tempfile = "3"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
