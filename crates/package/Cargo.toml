[package]
name = "boosteroid-package"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[dependencies]
boosteroid-common = { path = "../common" }
opennow-plugin-api = { git = "https://github.com/OpenCloudGaming/opennow", rev = "683eaa0ecfb60738388def065944c7284154be5c" }
opennow-plugin-package = { git = "https://github.com/OpenCloudGaming/opennow", rev = "683eaa0ecfb60738388def065944c7284154be5c" }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
zip = { version = "2", default-features = false, features = ["deflate"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
